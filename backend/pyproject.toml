[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphite"]

[project]
name = "graphite"
version = "0.1.0"
description = "A multimodal GraphRAG framework for complex technical blueprint analysis"
readme = "README.md"
authors = [
    { name = "Rayyan Tausalkar", email = "rayyantausalkar.dev@gmail.com" }
]
requires-python = ">=3.10,<3.11"

dependencies = [
    "torch==2.5.0",
    "torchvision==0.20.0",
    "torchaudio==2.5.0",
    "networkx>=3.4.2",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "shapely>=2.1.2",
    "matplotlib>=3.10.9",
    "pydantic>=2.13.5",
    "opencv-python>=5.0.0.93",
    "easyocr>=1.7.2",
    "fastapi",
    "uvicorn",
    "httpx>=0.28.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" }
]
torchvision = [
    { index = "pytorch-cu121" }
]
torchaudio = [
    { index = "pytorch-cu121" }
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
